<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Discado - My Favourites</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <!-- CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/cart.css">
    <link rel="stylesheet" href="/css/wishlist.css">

    <!-- i18n engine -->
    <script src="/js/core/i18n.js"></script>
    <!-- Header & Cart -->
    <script src="/js/components/DiscadoHeader.js"></script>
    <script src="/js/components/CartIntegration.js"></script>
</head>
<body>
    <div id="header-container"></div>

    <main>
        <div class="order-page-header">
            <h2><i class="fas fa-heart" style="color:#e9394f; margin-right:8px;"></i>My Favourites <span id="wishlistCount" class="wishlist-header-count"></span></h2>
            <p class="order-page-subtitle" data-i18n="wishlist.subtitle">Your saved products for quick ordering</p>
        </div>

        <ul id="wishlistContainer" class="wishlist-list">
            <div class="loading-container">
                <div class="loading-spinner"></div>
                <p>Loading your favourites...</p>
            </div>
        </ul>
    </main>

    <div id="footer-container"></div>
    <div id="cart-modal-container"></div>
    <div id="notification-container"></div>

    <script type="module" src="/js/core/app.js"></script>
    <script type="module">
        import { initWishlist } from '/js/modules/wishlist/wishlist.js';

        document.addEventListener('DOMContentLoaded', function() {
            if (window.DiscadoHeader) window.DiscadoHeader.init();
            if (window.CartIntegration) window.CartIntegration.init();

            fetch('/components/footer.html')
                .then(r => r.text())
                .then(data => {
                    const fc = document.getElementById('footer-container');
                    fc.innerHTML = data;
                    if (window.i18n) window.i18n.applyAll(fc);
                })
                .catch(() => {});

            initWishlist();
        });
    </script>
</body>
</html>
