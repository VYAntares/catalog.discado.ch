<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Discado - Reset Password</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/login.css">
</head>
<body class="login-page">
  <!-- Floating Language Switcher -->
  <div class="page-lang-switcher" id="pageLangSwitcher">
    <button class="page-lang-btn" id="pageLangBtn" aria-label="Select language">
      <i class="fas fa-globe"></i>
      <span id="pageLangCurrent">EN</span>
    </button>
    <div class="page-lang-dropdown" id="pageLangDropdown">
      <button class="page-lang-option" data-lang="en">🇬🇧 English</button>
      <button class="page-lang-option" data-lang="fr">🇫🇷 Français</button>
      <button class="page-lang-option" data-lang="de">🇩🇪 Deutsch</button>
      <button class="page-lang-option" data-lang="it">🇮🇹 Italiano</button>
    </div>
  </div>
  <div class="login-container">
    <div class="login-header">
      <div class="logo-container">
        <img src="/images/logo/logo_discado_noir.png" alt="Discado Logo">
      </div>
      <p class="login-subtitle" data-i18n="resetPassword.title">Set a New Password</p>
    </div>

    <div class="login-divider"></div>

    <!-- Invalid token message -->
    <div id="invalid-token" class="token-invalid" style="display:none;">
      <div class="token-invalid-icon">
        <i class="fas fa-link-slash"></i>
      </div>
      <h3>Invalid or Expired Link</h3>
      <p>This reset link is no longer valid. Please submit a new request.</p>
      <a href="/pages/forgot-password.html" class="login-button" style="display:inline-block; text-decoration:none; text-align:center; margin-top:16px;">
        <span class="btn-text">New Request</span>
      </a>
      <div class="forgot-back-link" style="margin-top:20px;">
        <a href="/pages/login.html"><i class="fas fa-arrow-left"></i> Back to Sign In</a>
      </div>
    </div>

    <!-- Loading while verifying token -->
    <div id="loading-state" class="loading-state">
      <div class="loading-spinner"></div>
      <p>Verifying...</p>
    </div>

    <!-- Reset password form -->
    <form id="resetForm" style="display:none;">
      <div class="input-group">
        <label for="password">New Password</label>
        <div class="input-wrapper">
          <input type="password" id="password" name="password" placeholder="Enter your new password" required>
          <i class="fas fa-lock field-icon"></i>
          <button type="button" class="input-action" id="password-toggle" aria-label="Show password">
            <i class="fas fa-eye-slash"></i>
          </button>
        </div>
      </div>

      <!-- Password strength indicator -->
      <div class="password-criteria" id="password-criteria">
        <div class="criteria-item" id="crit-length"><i class="fas fa-circle"></i> <span data-i18n="resetPassword.critLength">At least 8 characters</span></div>
        <div class="criteria-item" id="crit-upper"><i class="fas fa-circle"></i> <span data-i18n="resetPassword.critUpper">One uppercase letter</span></div>
        <div class="criteria-item" id="crit-lower"><i class="fas fa-circle"></i> <span data-i18n="resetPassword.critLower">One lowercase letter</span></div>
        <div class="criteria-item" id="crit-number"><i class="fas fa-circle"></i> <span data-i18n="resetPassword.critNumber">One number</span></div>
        <div class="criteria-item" id="crit-special"><i class="fas fa-circle"></i> <span data-i18n="resetPassword.critSpecial">One special character</span></div>
      </div>

      <div class="input-group">
        <label for="confirmPassword">Confirm Password</label>
        <div class="input-wrapper">
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password" required>
          <i class="fas fa-lock field-icon"></i>
          <button type="button" class="input-action" id="confirm-toggle" aria-label="Show password">
            <i class="fas fa-eye-slash"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="login-button" id="submitBtn">
        <span class="btn-text" data-i18n="resetPassword.resetBtn">Reset Password</span>
      </button>

      <div id="error-message" class="error-message">
        <i class="fas fa-exclamation-circle"></i>
        <span id="error-text"></span>
      </div>

      <div id="success-message" class="success-message" style="display:none;">
        <i class="fas fa-check-circle"></i>
        <span id="success-text"></span>
      </div>

      <div class="login-footer">
        <p>&copy; Discado — Professional Portal</p>
      </div>
    </form>
  </div>
  
  <script src="/js/core/i18n.js"></script>
  <script src="/js/reset-password.js"></script>
  <script>
    // Language switcher
    (function() {
      var btn = document.getElementById('pageLangBtn');
      var dropdown = document.getElementById('pageLangDropdown');
      var switcher = document.getElementById('pageLangSwitcher');
      var current = document.getElementById('pageLangCurrent');
      if (current && window.i18n) current.textContent = window.i18n.getLang().toUpperCase();
      if (btn) btn.addEventListener('click', function(e) {
        e.stopPropagation();
        dropdown.classList.toggle('open');
      });
      document.querySelectorAll('.page-lang-option').forEach(function(el) {
        el.addEventListener('click', function() {
          if (window.i18n) window.i18n.setLang(this.getAttribute('data-lang'));
        });
      });
      document.addEventListener('click', function(e) {
        if (switcher && !switcher.contains(e.target)) dropdown.classList.remove('open');
      });
    })();
  </script>
</body>
</html>
