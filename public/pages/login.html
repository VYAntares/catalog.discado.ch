<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Discado - Login</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Discado">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/login.css">
</head>
<body class="login-page">
  <!-- Floating Language Switcher -->
  <div class="page-lang-switcher" id="pageLangSwitcher">
    <button class="page-lang-btn" id="pageLangBtn" aria-label="Select language">
      <i class="fas fa-globe"></i>
      <span id="pageLangCurrent">EN</span>
    </button>
    <div class="page-lang-dropdown" id="pageLangDropdown">
      <button class="page-lang-option" data-lang="en">🇬🇧 English</button>
      <button class="page-lang-option" data-lang="fr">🇫🇷 Français</button>
      <button class="page-lang-option" data-lang="de">🇩🇪 Deutsch</button>
      <button class="page-lang-option" data-lang="it">🇮🇹 Italiano</button>
    </div>
  </div>
  <div class="login-container">
    <div class="login-header">
      <div class="logo-container">
        <img src="/images/logo/logo_discado_noir.png" alt="Discado Logo">
      </div>
      <p class="login-subtitle" data-i18n="login.subtitle">Sign in to your account</p>
    </div>

    <div class="login-divider"></div>

    <form id="loginForm" action="/login" method="POST" autocomplete="on">
      <div class="input-group">
        <label for="username" data-i18n="login.usernameLabel">Username or email</label>
        <div class="input-wrapper">
          <input type="text" id="username" name="username" data-i18n-ph="login.usernamePlaceholder" placeholder="Enter your username or email" required autocomplete="username">
          <i class="fas fa-user field-icon"></i>
        </div>
      </div>

      <div class="input-group">
        <label for="password" data-i18n="login.passwordLabel">Password</label>
        <div class="input-wrapper">
          <input type="password" id="password" name="password" data-i18n-ph="login.passwordPlaceholder" placeholder="Enter your password" required autocomplete="current-password">
          <i class="fas fa-lock field-icon"></i>
          <button type="button" class="input-action" id="password-toggle" data-i18n-aria="login.showPassword" aria-label="Show password">
            <i class="fas fa-eye-slash"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="login-button">
        <span class="btn-text" data-i18n="login.signIn">Sign In</span>
      </button>

      <div class="forgot-password-link">
        <a href="/pages/forgot-password.html" data-i18n="login.forgotPassword">Forgot your password?</a>
      </div>

      <div id="error-message" class="error-message">
        <i class="fas fa-exclamation-circle"></i>
        <span id="error-text">Invalid username or password.</span>
      </div>

      <div id="attempts-warning" class="attempts-warning">
        <i class="fas fa-shield-alt"></i>
        <span id="attempts-text"></span>
      </div>

      <div class="login-footer">
        <p>&copy; Discado — Professional Portal</p>
      </div>
    </form>
  </div>
  
  <script src="/js/core/i18n.js"></script>
  <script src="/js/login.js"></script>
  <script>
    // Language switcher
    (function() {
      var btn = document.getElementById('pageLangBtn');
      var dropdown = document.getElementById('pageLangDropdown');
      var switcher = document.getElementById('pageLangSwitcher');
      var current = document.getElementById('pageLangCurrent');
      if (current && window.i18n) current.textContent = window.i18n.getLang().toUpperCase();
      if (btn) btn.addEventListener('click', function(e) {
        e.stopPropagation();
        dropdown.classList.toggle('open');
      });
      document.querySelectorAll('.page-lang-option').forEach(function(el) {
        el.addEventListener('click', function() {
          if (window.i18n) window.i18n.setLang(this.getAttribute('data-lang'));
        });
      });
      document.addEventListener('click', function(e) {
        if (switcher && !switcher.contains(e.target)) dropdown.classList.remove('open');
      });
    })();
    // iOS only: block horizontal swipe/scroll on login page
    (function() {
      var startX = 0, startY = 0;
      document.addEventListener('touchstart', function(e) {
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
      }, { passive: true });
      document.addEventListener('touchmove', function(e) {
        var dx = Math.abs(e.touches[0].clientX - startX);
        var dy = Math.abs(e.touches[0].clientY - startY);
        // Block if movement is more horizontal than vertical
        if (dx > dy && dx > 8) e.preventDefault();
      }, { passive: false });
    })();
  </script>
</body>
</html>
