<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Discado - Login</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/login.css">
</head>
<body class="login-page">
  <div class="login-container">
    <div class="login-header">
      <div class="logo-container">
        <img src="/images/logo/logo_discado_noir.png" alt="Discado Logo">
      </div>
      <p class="login-subtitle">Sign in to your account</p>
    </div>

    <div class="login-divider"></div>

    <form id="loginForm" action="/login" method="POST">
      <div class="input-group">
        <label for="username">Username</label>
        <div class="input-wrapper">
          <input type="text" id="username" name="username" placeholder="Enter your username" required>
          <i class="fas fa-user field-icon"></i>
        </div>
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <input type="password" id="password" name="password" placeholder="Enter your password" required>
          <i class="fas fa-lock field-icon"></i>
          <button type="button" class="input-action" id="password-toggle" aria-label="Show password">
            <i class="fas fa-eye-slash"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="login-button">
        <span class="btn-text">Sign In</span>
      </button>

      <div class="forgot-password-link">
        <a href="/pages/forgot-password.html">Forgot your password?</a>
      </div>

      <div id="error-message" class="error-message">
        <i class="fas fa-exclamation-circle"></i>
        <span id="error-text">Invalid username or password.</span>
      </div>

      <div id="attempts-warning" class="attempts-warning">
        <i class="fas fa-shield-alt"></i>
        <span id="attempts-text"></span>
      </div>

      <div class="login-footer">
        <p>&copy; Discado — Professional Portal</p>
      </div>
    </form>
  </div>
  
  <script src="/js/login.js"></script>
</body>
</html>
