<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Discado - Login</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <style>
    /* Reset complet pour éviter les conflits avec main.css */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', Arial, sans-serif;
    }
    
    body.login-page {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #e9394f, #ff3333);
      padding: 0;
      margin: 0;
      font-family: 'Inter', Arial, sans-serif;
      /* Suppression du padding-top qui peut causer des problèmes */
      padding-top: 0 !important;
    }
    
    .login-container {
      background: #fff;
      padding: 35px 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      text-align: center;
      width: 350px;
      max-width: 90%;
      position: relative;
    }
    
    /* Container spécifique pour aligner verticalement logo puis texte */
    .login-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 25px;
      position: relative;
    }
    
    .logo-container {
      margin-bottom: 15px;
    }
    
    .logo-container img {
      height: 45px;
      width: auto;
    }
    
    .login-title {
      font-size: 22px;
      font-weight: 600;
      color: #333;
      margin-top: 5px;
      text-align: center;
    }
    
    .input-group {
      margin-bottom: 20px;
      text-align: left;
      position: relative;
    }
    
    .input-group label {
      display: block;
      font-weight: 500;
      margin-bottom: 8px;
      color: #555;
      font-size: 14px;
    }
    
    .input-group input {
      width: 100%;
      padding: 14px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 15px;
      transition: all 0.3s;
      box-sizing: border-box;
    }
    
    .input-group input:focus {
      border-color: #2575fc;
      outline: none;
      box-shadow: 0 0 0 3px rgba(37, 117, 252, 0.15);
    }
    
    .input-icon {
      position: absolute;
      right: 12px;
      top: 38px;
      color: #777;
      font-size: 18px;
      cursor: pointer;
    }
    
    .login-button {
      width: 100%;
      padding: 14px 12px;
      border: none;
      border-radius: 6px;
      background: #2575fc;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 8px rgba(37, 117, 252, 0.2);
      margin-top: 5px;
    }
    
    .login-button:hover {
      background: #1a60d9;
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(37, 117, 252, 0.25);
    }
    
    .login-button:active {
      transform: translateY(0);
      box-shadow: 0 2px 6px rgba(37, 117, 252, 0.2);
    }
    
    .error-message {
      color: #e74c3c;
      margin-top: 15px;
      font-size: 14px;
      display: none;
      text-align: center;
      padding: 8px;
      background-color: rgba(231, 76, 60, 0.1);
      border-radius: 4px;
    }
    
    .error-message.visible {
      display: block;
    }
    
    .forgot-password {
      display: block;
      margin-top: 15px;
      color: #777;
      font-size: 13px;
      text-decoration: none;
    }
    
    .forgot-password:hover {
      color: #2575fc;
      text-decoration: underline;
    }
    
    @media (max-width: 480px) {
      .login-container {
        padding: 25px 20px;
      }
      
      .logo-container img {
        height: 40px;
      }
      
      .login-title {
        font-size: 20px;
        margin: 10px 0;
      }
    }
  </style>
</head>
<body class="login-page">
  <div class="login-container">
    <div class="login-header">
      <div class="logo-container">
        <img src="/images/logo/logo_discado_noir.png" alt="Discado Logo">
      </div>
   </div>
    
    <form id="loginForm" action="/login" method="POST">
      <div class="input-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required>
        <span class="input-icon">
          <i class="fas fa-user"></i>
        </span>
      </div>
      
      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
        <span class="input-icon" id="password-toggle">
          <i class="fas fa-eye-slash"></i>
        </span>
      </div>
      
      <button type="submit" class="login-button">Connect</button>
      
      <div id="error-message" class="error-message">
        Invalid username or password.
      </div>      
  </div>
  
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Check for login error parameter in URL
      const urlParams = new URLSearchParams(window.location.search);
      const loginError = urlParams.get('error');
      
      if (loginError) {
        document.getElementById('error-message').classList.add('visible');
      }
      
      // Focus on username field
      document.getElementById('username').focus();
      
      // Password visibility toggle
      const passwordToggle = document.getElementById('password-toggle');
      const passwordField = document.getElementById('password');
      
      passwordToggle.addEventListener('click', function() {
        const type = passwordField.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordField.setAttribute('type', type);
        this.querySelector('i').classList.toggle('fa-eye');
        this.querySelector('i').classList.toggle('fa-eye-slash');
      });
    });
  </script>
</body>
</html>
