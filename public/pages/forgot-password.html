<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Discado - Forgot Password</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/login.css">
</head>
<body class="login-page">
  <div class="login-container">
    <div class="login-header">
      <div class="logo-container">
        <img src="/images/logo/logo_discado_noir.png" alt="Discado Logo">
      </div>
      <p class="login-subtitle" data-i18n="forgotPassword.title">Password Reset</p>
    </div>

    <div class="login-divider"></div>

    <!-- Step 1: Email form -->
    <form id="forgotForm">
      <p class="forgot-instructions" data-i18n="forgotPassword.instructions">
        Enter the email address associated with your account. You will receive a link to reset your password.
      </p>

      <div class="input-group">
        <label for="email" data-i18n="forgotPassword.emailLabel">Email</label>
        <div class="input-wrapper">
          <input type="email" id="email" name="email" data-i18n-ph="forgotPassword.emailPlaceholder" placeholder="Enter your email address" required>
          <i class="fas fa-envelope field-icon"></i>
        </div>
      </div>

      <button type="submit" class="login-button" id="submitBtn">
        <span class="btn-text" data-i18n="forgotPassword.sendLink">Send Reset Link</span>
      </button>

      <div id="error-message" class="error-message">
        <i class="fas fa-exclamation-circle"></i>
        <span id="error-text"></span>
      </div>

      <div id="success-message" class="success-message">
        <i class="fas fa-check-circle"></i>
        <span id="success-text"></span>
      </div>

      <div class="forgot-back-link">
        <a href="/pages/login.html"><i class="fas fa-arrow-left"></i> Back to Sign In</a>
      </div>

      <div class="login-footer">
        <p>&copy; Discado — Professional Portal</p>
      </div>
    </form>
  </div>
  
  <script src="/js/core/i18n.js"></script>
  <script src="/js/forgot-password.js"></script>
</body>
</html>
