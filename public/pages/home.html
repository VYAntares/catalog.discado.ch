<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Discado - Catalogue</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Discado">
<!-- CSS -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/main.css">
<link rel="stylesheet" href="/css/cart.css">
<link rel="stylesheet" href="/css/home.css">
<!-- i18n engine -->
<script src="/js/core/i18n.js"></script>
<!-- Header & Cart scripts -->
<script src="/js/components/DiscadoHeader.js"></script>
<script src="/js/components/CartIntegration.js"></script>
</head>
<body>

<div id="header-container"></div>

<main class="home-main">

  <!-- Hero image -->
  <img src="/images/lifestyle/lausanne.jpg" alt="Lausanne" class="home-hero-img">

  <!-- Texte de présentation -->
  <p class="home-intro" data-i18n="home.intro">
    Since 2008, we create and distribute a wide range of souvenir items, gadgets and textiles throughout Switzerland. You have access to our catalogue with more than 2,000 references.
  </p>

  <h2 class="home-section-title" data-i18n="home.categories">Our categories</h2>
  <div class="categories-grid" id="categoriesGrid">
    <div class="categories-loading">
      <div class="loading-spinner"></div>
      <p>Loading...</p>
    </div>
  </div>

  <!-- Texte intermédiaire -->
  <p class="home-intro" data-i18n="home.intro2">
    Our catalogue is regularly updated with new items, at unbeatable prices.
  </p>

  <!-- Vitrine -->
  <div class="home-vitrine">
    <img src="/images/lifestyle/vitrine1.jpg" alt="Vitrine Discado 1" class="vitrine-img">
    <img src="/images/lifestyle/vitrine2.jpg" alt="Vitrine Discado 2" class="vitrine-img">
  </div>

</main>

<div id="footer-container"></div>
<div id="cart-modal-container"></div>
<div id="notification-container"></div>

<script type="module">
import { fetchProducts } from '/js/core/api.js';
import { getAvailableCategories } from '/js/modules/catalog/productFilter.js';

document.addEventListener('DOMContentLoaded', async function () {
    if (window.DiscadoHeader) window.DiscadoHeader.init();
    if (window.CartIntegration) window.CartIntegration.init();

    fetch('/components/footer.html')
        .then(r => r.text())
        .then(html => {
            document.getElementById('footer-container').innerHTML = html;
            if (window.i18n) window.i18n.applyAll(document.getElementById('footer-container'));
        });

    const grid = document.getElementById('categoriesGrid');

    // Same matching logic as productList.js filterByCategory
    function matchesCategory(productCat, catId) {
        if (!productCat) return false;
        const pc = productCat.toLowerCase();
        const sc = catId.toLowerCase();
        return pc === sc
            || pc === sc.replace('-', '')
            || pc === sc.replace('_', '')
            || pc.includes(sc)
            || sc.includes(pc);
    }

    try {
        const products = await fetchProducts();
        const categories = getAvailableCategories();

        grid.innerHTML = '';
        let hasAny = true;

        // Card "Tout le catalogue"
        const allCard = document.createElement('a');
        allCard.href = '/pages/catalog.html?category=all';
        allCard.className = 'category-card';
        allCard.innerHTML = `
            <div class="category-card-img">
                <img src="/images/lifestyle/catalog_2025.jpg" alt="${window.t ? window.t('home.fullCatalogue') : 'Full catalogue'}" loading="lazy">
            </div>
            <div class="category-card-label">${window.t ? window.t('home.fullCatalogue') : 'Full catalogue'}</div>
        `;
        grid.appendChild(allCard);

        categories.forEach(cat => {
            if (cat.id === 'all') return;
            const firstProduct = products.find(p => matchesCategory(p.categorie, cat.id));
            if (!firstProduct) return;

            hasAny = true;
            const a = document.createElement('a');
            a.href = `/pages/catalog.html?category=${cat.id}`;
            a.className = 'category-card';
            a.innerHTML = `
                <div class="category-card-img">
                    <img src="${firstProduct.imageUrl}" alt="${cat.name}" loading="lazy">
                </div>
                <div class="category-card-label">${cat.name}</div>
            `;
            grid.appendChild(a);
        });

        if (!hasAny) {
            grid.innerHTML = `<p class="categories-empty">${window.t ? window.t('home.noCategories') : 'No categories available.'}</p>`;
        }
    } catch (e) {
        grid.innerHTML = `<p class="categories-empty">${window.t ? window.t('home.errorCategories') : 'Error loading categories.'}</p>`;
    }
});
</script>

</body>
</html>
