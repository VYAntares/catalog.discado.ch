<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Discado - Catalogue</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Discado">
<!-- CSS -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/main.css">
<link rel="stylesheet" href="/css/cart.css">
<link rel="stylesheet" href="/css/home.css">
<!-- Header & Cart scripts -->
<script src="/js/components/DiscadoHeader.js"></script>
<script src="/js/components/CartIntegration.js"></script>
</head>
<body>

<div id="header-container"></div>

<main class="home-main">
  <h2 class="home-section-title">Nos catégories</h2>
  <div class="categories-grid" id="categoriesGrid">
    <div class="categories-loading">
      <div class="loading-spinner"></div>
      <p>Chargement...</p>
    </div>
  </div>
</main>

<div id="footer-container"></div>
<div id="cart-modal-container"></div>
<div id="notification-container"></div>

<script type="module">
import { fetchProducts } from '/js/core/api.js';
import { getAvailableCategories } from '/js/modules/catalog/productFilter.js';

document.addEventListener('DOMContentLoaded', async function () {
    if (window.DiscadoHeader) window.DiscadoHeader.init();
    if (window.CartIntegration) window.CartIntegration.init();

    fetch('/components/footer.html')
        .then(r => r.text())
        .then(html => { document.getElementById('footer-container').innerHTML = html; });

    const grid = document.getElementById('categoriesGrid');

    // Same matching logic as productList.js filterByCategory
    function matchesCategory(productCat, catId) {
        if (!productCat) return false;
        const pc = productCat.toLowerCase();
        const sc = catId.toLowerCase();
        return pc === sc
            || pc === sc.replace('-', '')
            || pc === sc.replace('_', '')
            || pc.includes(sc)
            || sc.includes(pc);
    }

    try {
        const products = await fetchProducts();
        const categories = getAvailableCategories();

        grid.innerHTML = '';
        let hasAny = false;

        categories.forEach(cat => {
            const firstProduct = products.find(p => matchesCategory(p.categorie, cat.id));
            if (!firstProduct) return;

            hasAny = true;
            const a = document.createElement('a');
            a.href = `/pages/catalog.html?category=${cat.id}`;
            a.className = 'category-card';
            a.innerHTML = `
                <div class="category-card-img">
                    <img src="${firstProduct.imageUrl}" alt="${cat.name}" loading="lazy">
                </div>
                <div class="category-card-label">${cat.name}</div>
            `;
            grid.appendChild(a);
        });

        if (!hasAny) {
            grid.innerHTML = '<p class="categories-empty">Aucune catégorie disponible.</p>';
        }
    } catch (e) {
        grid.innerHTML = '<p class="categories-empty">Erreur lors du chargement.</p>';
    }
});
</script>

</body>
</html>
