<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Discado - Product Catalog</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<!-- CSS -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/css/main.css">
<link rel="stylesheet" href="/css/catalog.css">
<link rel="stylesheet" href="/css/cart.css">

<!-- i18n engine -->
<script src="/js/core/i18n.js"></script>
<!-- Enhanced Header Script -->
<script src="/js/components/DiscadoHeader.js"></script>
<!-- Cart Integration Script -->
<script src="/js/components/CartIntegration.js"></script>
</head>
<body>
<!-- Header will be loaded dynamically -->
<div id="header-container"></div>

<!-- Sticky search + categories bar -->
<div class="sticky-filter-bar">
  <!-- Sur desktop : bouton Catégories + barre de recherche côte à côte -->
  <div class="filter-row">
    <button class="categories-toggle-btn" id="categoriesToggleBtn" aria-label="Categories">
      <i class="fas fa-th-large"></i>
      <span class="btn-label" data-i18n="catalog.categories">Categories</span>
      <i class="fas fa-chevron-down categories-chevron"></i>
    </button>
    <div class="search-wrapper">
      <input type="text" id="searchInput" data-i18n-ph="catalog.searchPlaceholder" placeholder="Search for a product..." aria-label="Search">
      <button id="searchButton" aria-label="Search"><i class="fas fa-search"></i></button>
    </div>
  </div>
  <!-- Sur mobile : barre de catégories horizontale scrollable
       Sur desktop : dropdown masqué, affiché par le bouton ci-dessus -->
  <div class="categories-bar" id="categoriesBar"></div>
</div>

<!-- Catalog Layout (sidebar + products) -->
<div class="catalog-layout">
  <!-- Sidebar desktop (catégories uniquement) -->
  <aside class="catalog-sidebar" id="catalogSidebar">
    <div class="sidebar-categories" id="sidebarCategories"></div>
  </aside>

  <!-- Main Content -->
  <main>
    <ul id="productList"></ul>
  </main>
</div>

<!-- Footer -->
<div id="footer-container"></div>

<!-- Cart modal container -->
<div id="cart-modal-container"></div>

<!-- Notification container -->
<div id="notification-container"></div>

<!-- Category Filter Hidden Select (for compatibility) -->
<select id="categoryFilter" style="display: none;">
  <option value="all" selected>All Products</option>
</select>

<!-- Comportement de la sticky bar + dropdown catégories (desktop) -->
<script>
(function () {
    document.addEventListener('DOMContentLoaded', function () {
        // ── Masquer / afficher la barre au scroll ──
        const filterBar = document.querySelector('.sticky-filter-bar');
        if (filterBar) {
            let lastScrollY = window.scrollY;
            let ticking = false;
            const threshold = 60;

            window.addEventListener('scroll', function () {
                if (!ticking) {
                    requestAnimationFrame(function () {
                        const currentScrollY = window.scrollY;
                        if (currentScrollY > lastScrollY && currentScrollY > threshold) {
                            filterBar.classList.add('filter-bar-hidden');
                        } else {
                            filterBar.classList.remove('filter-bar-hidden');
                        }
                        lastScrollY = currentScrollY;
                        ticking = false;
                    });
                    ticking = true;
                }
            }, { passive: true });
        }

        // ── Dropdown catégories (desktop uniquement) ──
        const toggleBtn  = document.getElementById('categoriesToggleBtn');
        const categoriesBar = document.getElementById('categoriesBar');

        if (toggleBtn && categoriesBar) {
            // Ouvrir / fermer au clic sur le bouton
            toggleBtn.addEventListener('click', function (e) {
                e.stopPropagation();
                const isOpen = categoriesBar.classList.toggle('dropdown-open');
                toggleBtn.classList.toggle('active', isOpen);
            });

            // Fermer si clic en dehors
            document.addEventListener('click', function (e) {
                if (!categoriesBar.contains(e.target) && !toggleBtn.contains(e.target)) {
                    categoriesBar.classList.remove('dropdown-open');
                    toggleBtn.classList.remove('active');
                }
            });

            // Fermer + mettre à jour le label du bouton quand on choisit une catégorie
            categoriesBar.addEventListener('click', function (e) {
                const btn = e.target.closest('.category-button');
                if (btn) {
                    categoriesBar.classList.remove('dropdown-open');
                    toggleBtn.classList.remove('active');
                    const label = toggleBtn.querySelector('.btn-label');
                    if (label) label.textContent = btn.textContent.trim();
                }
            });
        }
    });
})();
</script>

<!-- Scripts -->
<script type="module">
import { initCatalog, filterProducts } from '/js/modules/catalog/productList.js';
import { initHorizontalCategories } from '/js/modules/catalog/productFilter.js';

document.addEventListener('DOMContentLoaded', function() {
    if (window.DiscadoHeader) {
        window.DiscadoHeader.init();
    }

    if (window.CartIntegration) {
        window.CartIntegration.init();
    }

    fetch('/components/footer.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('footer-container').innerHTML = data;
        })
        .catch(error => {
            console.error('Error loading footer:', error);
        });

    // Lire le paramètre ?category= depuis l'URL (vient de la page home)
    const urlParams = new URLSearchParams(window.location.search);
    const categoryParam = urlParams.get('category') || 'magnet';

    initCatalog({ defaultCategory: categoryParam });
    initHorizontalCategories(filterProducts, null, categoryParam);
});
</script>
</body>
</html>
