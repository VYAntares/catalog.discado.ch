<!-- Cart Modal -->
<div id="cart-modal" class="modal">
    <div class="modal-content cart-modal-content">

        <!-- Header -->
        <div class="cart-modal-header">
            <div class="cart-modal-title">
                <i class="fas fa-shopping-cart"></i>
                <h2 data-i18n="cart.title">Your Cart</h2>
            </div>
            <span class="close-modal" aria-label="Close">&times;</span>
        </div>

        <!-- Items list -->
        <div id="cart-items" class="cart-items-list">
            <p class="empty-cart"><i class="fas fa-shopping-basket"></i><br><span data-i18n="cart.empty">Your cart is empty</span></p>
        </div>

        <!-- Total breakdown -->
        <div class="cart-total">
            <div class="cart-total-row">
                <span class="cart-total-label" data-i18n="cart.exclVAT">Excl. VAT</span>
                <span id="cart-total-ht">0.00 CHF</span>
            </div>
            <div class="cart-total-row">
                <span class="cart-total-label" data-i18n="cart.vatLabel">VAT 8.1%</span>
                <span id="cart-total-tva">0.00 CHF</span>
            </div>
            <div class="cart-total-row cart-total-ttc-row">
                <span class="cart-total-label" data-i18n="cart.inclVAT">Total incl. VAT</span>
                <span id="cart-total-amount">0.00 CHF</span>
            </div>
        </div>

        <!-- Actions -->
        <div class="cart-actions">
            <button id="checkout-btn" class="primary-btn">
                <i class="fas fa-check"></i> <span data-i18n="cart.orderNow">Order Now</span>
            </button>
        </div>

        <!-- Lien secondaire vers les commandes -->
        <div class="cart-footer-link">
            <a href="/pages/orders.html">
                <i class="fas fa-receipt"></i>
                <span data-i18n="cart.viewOrders">View My Orders</span>
            </a>
        </div>

        <!-- Confirmation (shown after successful order) -->
        <div id="cart-confirmation" class="cart-confirmation">
            <div class="cart-confirmation-icon">
                <i class="fas fa-check-circle"></i>
            </div>
            <h3 data-i18n="cart.orderPlaced">Order Placed!</h3>
            <p data-i18n="cart.orderPlacedDesc">Your order has been placed successfully!</p>
            <p class="cart-confirmation-note" data-i18n="cart.orderPlacedNote">You can track your order status in "My Orders"</p>
            <button id="view-orders-btn" class="view-orders-btn">
                <i class="fas fa-receipt"></i> <span data-i18n="cart.viewOrders">View My Orders</span>
            </button>
        </div>

    </div>
</div>
