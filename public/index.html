<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Discado - Welcome</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Discado">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/welcome.css">
    <script src="/js/core/i18n.js"></script>
</head>
<body class="welcome-page">
    <!-- Floating Language Switcher -->
    <div class="page-lang-switcher" id="pageLangSwitcher">
        <button class="page-lang-btn" id="pageLangBtn" aria-label="Select language">
            <i class="fas fa-globe"></i>
            <span id="pageLangCurrent">EN</span>
        </button>
        <div class="page-lang-dropdown" id="pageLangDropdown">
            <button class="page-lang-option" data-lang="en">🇬🇧 English</button>
            <button class="page-lang-option" data-lang="fr">🇫🇷 Français</button>
            <button class="page-lang-option" data-lang="de">🇩🇪 Deutsch</button>
            <button class="page-lang-option" data-lang="it">🇮🇹 Italiano</button>
        </div>
    </div>
    <div class="welcome-container">
        <div class="logo-container">
            <img src="/images/logo/logo_discado_noir.png" alt="Discado Logo">
        </div>

        <div class="welcome-divider"></div>

        <h1 data-i18n="welcome.title">Welcome to Discado</h1>

        <p class="welcome-subtitle" data-i18n="welcome.subtitle">Log in to browse our catalog of promotional products for your business.</p>

        <div class="button-container">
            <a href="/pages/login.html" id="login-btn" class="button primary-btn">
                <i class="fas fa-sign-in-alt"></i> <span data-i18n="welcome.loginBtn">Log In</span>
            </a>
            <a href="mailto:catalog.discado@gmail.com?subject=Account%20Request&body=Hello%20Discado%20Team,%0A%0AI%20am%20interested%20in%20creating%20an%20account%20to%20access%20your%20catalog.%0A%0AShop%20name:%20%0AContact%20person:%20%0APhone:%20%0A%0AThank%20you." id="request-btn" class="button secondary-btn">
                <i class="fas fa-envelope"></i> <span data-i18n="welcome.requestBtn">Request Account</span>
            </a>
        </div>

        <p class="info-text" data-i18n="welcome.infoText">Don't have an account yet? Click "Request Account" and we'll create one for you.</p>

        <div id="auth-status" class="auth-status"></div>
    </div>

    <script src="/js/welcome.js"></script>
    <script>
      // Language switcher
      (function() {
        var btn = document.getElementById('pageLangBtn');
        var dropdown = document.getElementById('pageLangDropdown');
        var switcher = document.getElementById('pageLangSwitcher');
        var current = document.getElementById('pageLangCurrent');
        if (current && window.i18n) current.textContent = window.i18n.getLang().toUpperCase();
        if (btn) btn.addEventListener('click', function(e) {
          e.stopPropagation();
          dropdown.classList.toggle('open');
        });
        document.querySelectorAll('.page-lang-option').forEach(function(el) {
          el.addEventListener('click', function() {
            if (window.i18n) window.i18n.setLang(this.getAttribute('data-lang'));
          });
        });
        document.addEventListener('click', function(e) {
          if (switcher && !switcher.contains(e.target)) dropdown.classList.remove('open');
        });
      })();

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(function(reg) {
              console.log('[PWA] Service Worker enregistre', reg.scope);
              reg.update();
              if (reg.waiting) reg.waiting.postMessage('skipWaiting');
              reg.addEventListener('updatefound', function() {
                var nw = reg.installing;
                nw.addEventListener('statechange', function() {
                  if (nw.state === 'activated') location.reload();
                });
              });
            })
            .catch(err => console.warn('[PWA] Erreur SW:', err));
        });
      }
    </script>
</body>
</html>
