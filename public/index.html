<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Discado - Welcome</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#dd6060">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Discado">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/welcome.css">
</head>
<body class="welcome-page">
    <div class="welcome-container">
        <div class="logo-container">
            <img src="/images/logo/logo_discado_noir.png" alt="Discado Logo">
        </div>

        <div class="welcome-divider"></div>

        <h1>Welcome to Discado</h1>

        <p class="welcome-subtitle">Log in to browse our catalog of promotional products for your business.</p>

        <div class="button-container">
            <a href="/pages/login.html" id="login-btn" class="button primary-btn">
                <i class="fas fa-sign-in-alt"></i> Log In
            </a>
            <a href="mailto:catalog.discado@gmail.com?subject=Account%20Request&body=Hello%20Discado%20Team,%0A%0AI%20am%20interested%20in%20creating%20an%20account%20to%20access%20your%20catalog.%0A%0AShop%20name:%20%0AContact%20person:%20%0APhone:%20%0A%0AThank%20you." id="request-btn" class="button secondary-btn">
                <i class="fas fa-envelope"></i> Request Account
            </a>
        </div>

        <p class="info-text">Don't have an account yet? Click "Request Account" and we'll create one for you.</p>

        <div id="auth-status" class="auth-status"></div>
    </div>

    <script src="/js/welcome.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(function(reg) {
              console.log('[PWA] Service Worker enregistre', reg.scope);
              reg.update();
              if (reg.waiting) reg.waiting.postMessage('skipWaiting');
              reg.addEventListener('updatefound', function() {
                var nw = reg.installing;
                nw.addEventListener('statechange', function() {
                  if (nw.state === 'activated') location.reload();
                });
              });
            })
            .catch(err => console.warn('[PWA] Erreur SW:', err));
        });
      }
    </script>
</body>
</html>
