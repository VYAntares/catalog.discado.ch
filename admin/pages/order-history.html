<!DOCTYPE html>
<html lang="fr">
<head>

    <link rel="stylesheet" href="/admin/css/orders.css">
    <link rel="stylesheet" href="/admin/css/history.css">
    <link rel="stylesheet" href="/admin/css/history-view.css">
    <link rel="stylesheet" href="/admin/css/calendar.css">

<script>if(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform())document.body?document.body.classList.add("capacitor-ios"):document.addEventListener("DOMContentLoaded",function(){document.body.classList.add("capacitor-ios")});</script>

<body>
    <!-- Header -->
    <header>
        <div class="header-container">
            <div class="logo-container">
                <img src="/public/images/logo/logo_discado_noir.png" alt="Discado Logo">
            </div>
            <div class="admin-user-menu">
                <button class="admin-menu-btn" id="adminMenuToggle" aria-label="Menu utilisateur">
                    <i class="fas fa-user-shield"></i>
                    <span class="hamburger-icon" aria-hidden="true">
                        <span class="hamburger-line"></span>
                        <span class="hamburger-line"></span>
                        <span class="hamburger-line"></span>
                    </span>
                </button>
                <div class="admin-dropdown" id="adminDropdown">
                    <a href="/pages/catalog.html"><i class="fas fa-store"></i> Catalogue</a>
                    <a href="/logout" class="menu-logout"><i class="fas fa-sign-out-alt"></i> Déconnexion</a>
                </div>
            </div>
        </div>
    </header>

    <!-- Tabs Navigation -->
	<div class="admin-tabs">
		<div class="tabs-container">
			<a href="/admin/orders" class="tab">
				<i class="fas fa-shopping-cart"></i> Gestion des commandes
			</a>
			<a href="/admin/order-history" class="tab">

			</a>
			<a href="/admin/clients" class="tab">

			</a>
			<a href="/admin/compta" class="tab">
				<i class="fas fa-calculator"></i> Compta
			</a>
			<a href="/admin/stock" class="tab">
				<i class="fas fa-boxes"></i> Stock
			</a>
            <a href="/admin/suppliers" class="tab">
                <i class="fas fa-truck"></i> Fournisseurs
            </a>
			<a href="/admin/results" class="tab">

		</div>

    <!-- Main Content -->
    <main>
        <h1 class="page-title">
            <i class="fas fa-history"></i> Historique des commandes traitées
        </h1>

        <!-- Search bar -->
        <div class="search-container">
            <input type="text" id="searchOrderInput" class="search-input" 
                placeholder="Rechercher une commande par ID, client, boutique...">
            <button id="searchOrderBtn" class="search-btn">
                <i class="fas fa-search"></i> Rechercher
            </button>
        </div>

        <!-- Order History List -->
        <div class="order-list" id="historyOrderList">
            <!-- Les commandes traitées seront chargées dynamiquement ici -->
            <div id="loading-indicator" class="loading">Chargement de l'historique des commandes...</div>
        </div>
    </main>

    <!-- Modal pour les détails de commande -->
    <div id="orderModal" class="modal order-details-modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>

            <div id="orderModalContent" class="modal-body">
                <!-- Les détails de la commande seront chargés ici dynamiquement -->
            </div>
        </div>
    </div>

    <!-- Conteneur de notifications -->
    <div id="notification-container"></div>
        <script src="/admin/js/utils/adminMenu.js"></script>
    <script type="module" src="/admin/js/utils/tabsPermissions.js"></script>

    <!-- Force SW update + inline downloadOrShareFile (bypasses JS cache) -->
    <script>
    (function(){
        if('serviceWorker' in navigator){
            navigator.serviceWorker.register('/sw.js').then(function(reg){
                reg.update();
                if(reg.waiting) reg.waiting.postMessage('skipWaiting');
                reg.addEventListener('updatefound',function(){
                    var nw=reg.installing;
                    nw.addEventListener('statechange',function(){
                        if(nw.state==='activated') location.reload();
                    });
                });
            });
        }
        window.downloadOrShareFile=async function(url,filename,mimeType){
            mimeType=mimeType||'application/pdf';
            var res=await fetch(url,{credentials:'include'});
            if(!res.ok){var d=await res.json().catch(function(){return{}});throw new Error(d.error||'Erreur HTTP '+res.status);}
            var blob=await res.blob();
            var isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
            var isMobile=isIOS||/Android/i.test(navigator.userAgent);
            if(isMobile&&navigator.share){
                try{var file=new File([blob],filename,{type:mimeType});await navigator.share({files:[file],title:filename});return;}
                catch(e){if(e.name==='AbortError')return;}
            }
            if(isIOS){window._showPdfOverlay(blob,filename,mimeType);return;}
            var u=URL.createObjectURL(blob);var a=document.createElement('a');a.href=u;a.download=filename;a.style.visibility='hidden';document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(u)},1000);
        };
        window._showPdfOverlay=function(blob,fn,mt){
            var old=document.getElementById('cap-pdf-overlay');if(old)old.remove();
            var u=URL.createObjectURL(blob);
            var ov=document.createElement('div');ov.id='cap-pdf-overlay';ov.style.cssText='position:fixed;top:0;left:0;right:0;bottom:0;z-index:99999;background:rgba(0,0,0,.92);display:flex;flex-direction:column;';
            var hd=document.createElement('div');hd.style.cssText='display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#1a1a2e;flex-shrink:0;gap:8px;';
            var t=document.createElement('span');t.textContent=fn;t.style.cssText='color:#fff;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;';hd.appendChild(t);
            var sb=document.createElement('button');sb.innerHTML='<i class="fas fa-share-alt"></i> Partager';sb.style.cssText='background:#3498db;color:#fff;border:none;padding:8px 14px;border-radius:6px;font-size:13px;cursor:pointer;flex-shrink:0;';
            sb.addEventListener('click',async function(){try{var f=new File([blob],fn,{type:mt});await navigator.share({files:[f],title:fn});}catch(e){}});hd.appendChild(sb);
            var cb=document.createElement('button');cb.innerHTML='<i class="fas fa-times"></i>';cb.style.cssText='background:#e74c3c;color:#fff;border:none;padding:8px 14px;border-radius:6px;font-size:15px;cursor:pointer;flex-shrink:0;';
            cb.addEventListener('click',function(){ov.remove();URL.revokeObjectURL(u);});hd.appendChild(cb);ov.appendChild(hd);
            var vw=document.createElement('iframe');vw.src=u;vw.style.cssText='flex:1;border:none;background:#fff;';ov.appendChild(vw);document.body.appendChild(ov);
        };
    })();
    </script>

    <!-- Inclure les scripts JS en type module pour supporter ES6 imports -->
    <script type="module" src="/admin/js/core/app.js?v=5"></script>
</body>
</html>
