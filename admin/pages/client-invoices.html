<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Factures Client - Discado</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/admin/css/main.css">
    <link rel="stylesheet" href="/admin/css/compta-client-styles.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="header-container">
            <div class="logo-container">
                <img src="/public/images/logo/logo_discado_noir.png" alt="Discado Logo">
            </div>
            <div class="admin-user">
                <i class="fas fa-user-shield"></i>
                <span>Admin</span>
                <a href="/logout" class="logout-btn">
                    <i class="fas fa-sign-out-alt"></i> Déconnexion
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <!-- Back Button & Client Info -->
        <div class="client-invoices-header">
            <a href="/admin/compta?tab=clients" class="back-btn">
                <i class="fas fa-arrow-left"></i> Retour à la comptabilité
            </a>
            <h1 class="page-title">
                <i class="fas fa-user"></i> Factures de <span id="clientName">...</span>
            </h1>
            <div class="client-info">
                <span class="client-id-label">ID Client:</span>
                <span id="clientId" class="client-id-value">...</span>
            </div>
        </div>

        <!-- Sort Controls -->
		<div class="sort-controls">
			<button id="sortBtn" class="sort-btn" data-order="desc">
				<i class="fas fa-sort-amount-down"></i>
				<span id="sortText">Plus récente à plus ancienne</span>
			</button>
			
			<!-- NOUVEAU BOUTON EXPORT CSV -->
			<button id="exportCsvBtn" class="export-btn">
				<i class="fas fa-file-csv"></i>
				Exporter en CSV
			</button>
		</div>

        <!-- Invoices Table (Excel style) -->
        <div class="client-invoices-container">
            <div class="invoices-table-wrapper">
                <table class="invoices-table" id="invoicesTable">
                    <thead>
                        <tr>
                            <th>Num facture</th>
                            <th>Date</th>
                            <th>Client</th>
                            <th>Montant HT</th>
                            <th>TVA</th>
                            <th>Montant TTC</th>
                            <th>Date échéance</th>
                            <th>Montant encaissé</th>
                            <th>Sold</th>
                            <th>Date paiement</th>
                            <th>Statut</th>
							<th>Commissions</th>
							<th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="invoicesTableBody">
                        <tr>
                            <td colspan="13" class="loading">Chargement des factures...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Conteneur de notifications -->
    <div id="notification-container"></div>
    <script type="module" src="/admin/js/utils/tabsPermissions.js"></script>

    <!-- Scripts JS -->
    <script type="module" src="/admin/js/modules/compta/comptaClientTable.js"></script>
</body>
</html>
