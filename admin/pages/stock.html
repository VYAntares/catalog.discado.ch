<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gestion du Stock - Discado</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/admin/css/main.css">
    <link rel="stylesheet" href="/admin/css/stock.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="header-container">
            <div class="logo-container">
                <img src="/public/images/logo/logo_discado_noir.png" alt="Discado Logo">
            </div>
            <div class="admin-user">
                <i class="fas fa-user-shield"></i>
                <span>Admin</span>
                <a href="/logout" class="logout-btn">
                    <i class="fas fa-sign-out-alt"></i> Déconnexion
                </a>
            </div>
        </div>
    </header>

    <!-- Tabs Navigation -->
	<div class="admin-tabs">
		<div class="tabs-container">
			<a href="/admin/orders" class="tab">
				<i class="fas fa-shopping-cart"></i> Gestion des commandes
			</a>
			<a href="/admin/order-history" class="tab">
				<i class="fas fa-history"></i> Historique des commandes
			</a>
			<a href="/admin/clients" class="tab">
				<i class="fas fa-users"></i> Client Database
			</a>
			<a href="/admin/compta" class="tab">
				<i class="fas fa-calculator"></i> Compta
			</a>
			<a href="/admin/stock" class="tab">
				<i class="fas fa-boxes"></i> Stock
			</a>
            <a href="/admin/suppliers" class="tab">
                <i class="fas fa-truck"></i> Fournisseurs
            </a>
			<a href="/admin/stats" class="tab">
				<i class="fas fa-chart-line"></i> Stats
			</a>
		</div>
	</div>


    <!-- Main Content -->
    <main>
        <div class="stock-container">
            <h1 class="page-title">
                <i class="fas fa-boxes"></i> Gestion du Stock
            </h1>

            <!-- Stock Statistics -->
            <div class="stock-stats">
                <div class="stat-card">
                    <div class="stat-icon primary">
                        <i class="fas fa-box"></i>
                    </div>
                    <div class="stat-info">
                        <h3 id="total-products">0</h3>
                        <p>Total Produits</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon success">
                        <i class="fas fa-check-circle"></i>
                    </div>
                    <div class="stat-info">
                        <h3 id="in-stock-count">0</h3>
                        <p>En Stock</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon warning">
                        <i class="fas fa-exclamation-triangle"></i>
                    </div>
                    <div class="stat-info">
                        <h3 id="low-stock-count">0</h3>
                        <p>Stock Faible</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="background: #ffe6e6; color: #f56565;">
                        <i class="fas fa-times-circle"></i>
                    </div>
                    <div class="stat-info">
                        <h3 id="out-stock-count">0</h3>
                        <p>Rupture de Stock</p>
                    </div>
                </div>
            </div>

            <!-- Filters -->
            <div class="stock-filters">
                <div class="filter-group">
                    <div class="filter-item">
                        <label for="search-input">
                            <i class="fas fa-search"></i> Rechercher un produit
                        </label>
                        <input type="text" 
                               id="search-input" 
                               placeholder="Nom du produit...">
                    </div>
                    <div class="filter-item">
                        <label for="stock-filter">
                            <i class="fas fa-filter"></i> Filtrer par stock
                        </label>
                        <select id="stock-filter">
                            <option value="all">Tous les produits</option>
                            <option value="in-stock">En stock (>250)</option>
                            <option value="low-stock">Stock faible (1-250)</option>
                            <option value="out-of-stock">Rupture de stock (0)</option>
                        </select>
                    </div>
                    <div class="filter-item">
                        <label for="supplier-filter">
                            <i class="fas fa-truck"></i> Filtrer par fournisseur
                        </label>
                        <select id="supplier-filter">
                            <option value="all">Tous les fournisseurs</option>
                            <!-- Options générées dynamiquement -->
                        </select>
                    </div>
                    <div class="filter-item">
                        <label for="sort-select">
                            <i class="fas fa-sort"></i> Trier par
                        </label>
                        <select id="sort-select">
                            <option value="name-asc" selected>Nom (A-Z)</option>
                            <option value="name-desc">Nom (Z-A)</option>
                            <option value="stock-asc">Stock (croissant)</option>
                            <option value="stock-desc">Stock (décroissant)</option>
                            <option value="price-asc">Prix (croissant)</option>
                            <option value="price-desc">Prix (décroissant)</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Category Tabs -->
            <div class="category-tabs">
                <!-- Tabs will be generated dynamically -->
            </div>

            <!-- Products Grid -->
            <div class="products-grid" id="products-container">
                <!-- Products will be loaded here -->
                <div class="loading-container">
                    <div class="loading-spinner"></div>
                    <p>Chargement des produits...</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal Ajouter à commande fournisseur -->
    <div class="modal-overlay" id="addToOrderModal" style="display: none;">
        <div class="modal-content" style="max-width: 600px;">
            <div class="modal-header">
                <h3><i class="fas fa-truck-loading"></i> Ajouter à une commande fournisseur</h3>
                <button class="modal-close" id="closeAddToOrderModal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Produit</label>
                    <input type="text" id="addOrderProductName" readonly style="background: #f7fafc; font-weight: 600;">
                    <input type="hidden" id="addOrderProductId">
                </div>
                
                <div class="form-group">
                    <label>Commande fournisseur *</label>
                    <select id="addOrderSelect" required>
                        <option value="">Chargement...</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Quantité *</label>
                    <input type="number" id="addOrderQuantity" min="1" value="50" required>
                </div>
                
                <div class="form-group">
                    <label>Prix unitaire (USD) *</label>
                    <input type="number" id="addOrderPrice" step="0.01" min="0" required>
                </div>
                
                <div class="form-group">
                    <label>Total</label>
                    <input type="text" id="addOrderTotal" readonly style="background: #edf2f7; font-weight: 600;">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="modal-btn modal-btn-secondary" id="cancelAddToOrder">Annuler</button>
                <button type="button" class="modal-btn modal-btn-primary" id="submitAddToOrder">
                    <i class="fas fa-check"></i> Ajouter à la commande
                </button>
            </div>
        </div>
    </div>

    <!-- Conteneur de notifications -->
    <div id="notification-container"></div>
    

    <!-- Scripts -->
    <!-- ✅ AJOUTER LE MODULE DE PERMISSIONS EN PREMIER -->
    <script type="module" src="/admin/js/utils/tabsPermissions.js"></script>
    <!-- Ensuite charger le module spécifique à la page -->
    <script src="/admin/js/modules/stock/stockManager.js?v=2"></script>

    <script type="module" src="/admin/js/modules/suppliers/productStatsModal.js"></script>
</body>
</body>
</html>
